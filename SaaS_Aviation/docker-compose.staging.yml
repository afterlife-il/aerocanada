name: saas-aviation-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-aviation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_aviation_staging
      POSTGRES_USER: saas_aviation_staging_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - saas_aviation_postgres_data:/var/lib/postgresql/data
    networks: [staging]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_aviation_staging_app -d saas_aviation_staging"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 640m
    cpus: 0.75
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: saas-aviation-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - saas_aviation_redis_data:/data
    networks: [staging]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: saas-aviation-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data
    volumes:
      - saas_aviation_minio_data:/data
    networks: [staging]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:?BUILD_COMMIT is required}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:?BUILD_TIMESTAMP is required}
    image: ready2go/saas-aviation-api:${BUILD_COMMIT:?BUILD_COMMIT is required}
    container_name: saas-aviation-api
    restart: unless-stopped
    env_file:
      - ${SAAS_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      API_PORT: "4107"
      PERSISTENCE_PROVIDER: postgres
      DATABASE_URL: postgresql://saas_aviation_staging_app:${POSTGRES_PASSWORD}@postgres:5432/saas_aviation_staging
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: "1"
      DATABASE_POOL_MAX: "8"
      CORS_ORIGIN: https://aviation.ready2go.aero
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: saas-aviation-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [staging]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4107/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 384m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:?BUILD_COMMIT is required}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:?BUILD_TIMESTAMP is required}
        NEXT_PUBLIC_BASE_PATH: ""
        NEXT_PUBLIC_SAAS_DATA_SOURCE_MODE: persistent-api
        NEXT_PUBLIC_SAAS_API_BASE_URL: /api
    image: ready2go/saas-aviation-web:${BUILD_COMMIT:?BUILD_COMMIT is required}
    container_name: saas-aviation-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:8180:8080
    depends_on:
      api:
        condition: service_healthy
    networks: [staging]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt: [no-new-privileges:true]
    logging: *default-logging

networks:
  staging:
    name: saas_aviation_staging
    driver: bridge

volumes:
  saas_aviation_postgres_data:
    name: saas_aviation_postgres_data
  saas_aviation_redis_data:
    name: saas_aviation_redis_data
  saas_aviation_minio_data:
    name: saas_aviation_minio_data
