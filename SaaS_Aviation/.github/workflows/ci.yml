name: SaaS Aviation CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SaaS_Aviation/package-lock.json
      - name: Install
        working-directory: SaaS_Aviation
        run: npm ci
      - name: Lint
        working-directory: SaaS_Aviation
        run: npm run lint
      - name: Typecheck
        working-directory: SaaS_Aviation
        run: npm run typecheck
      - name: Test
        working-directory: SaaS_Aviation
        run: npm run test
      - name: Build
        working-directory: SaaS_Aviation
        run: npm run build
