services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_aviation_postgres_dev
    environment:
      POSTGRES_DB: saas_aviation_dev
      POSTGRES_USER: saas_aviation_dev
      POSTGRES_PASSWORD: saas_aviation_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - saas_aviation_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_aviation_dev -d saas_aviation_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  saas_aviation_postgres_dev:
