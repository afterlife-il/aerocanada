
<!DOCTYPE HTML>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<title>CSS3 - Shadows</title>
	<link rel="stylesheet" href="/xmedia/tuto/styles.css" media="all" />
	
	<style type="text/css">
		
		/*
			Styles de présentation
			(styles de la démo plus bas)
		*/
		
		#wrap { text-align: center; }
		#wrap h2 { text-align: left; }
		.bloc_text:target ~ .bloc_text { display:none; }
		.bloc_text {
			margin: 2.5em 0;
			color: #018CC1;
			font-size: 4em;
		}
		#ex1 {
			margin-top: 1em;
		}
		
		
		/*
			Styles de la démo
		*/

		.single_shadow {
			text-shadow: 1px 2px 3px rgba(0,0,0,0.5);
		}

		.more_readable {
			color: #fff;
			text-shadow: 0 0 7px rgba(0,0,0,0.5);
		}
		.more_readable span {
			text-shadow: 0 0 0;
		}

		.multiple_shadow {
			color: #333;
			text-shadow: -0.06em 0 red, 
						 0.06em 0 cyan;
		}

		.border_text {
			color: #d1d9df;
			text-shadow: -1px 0 0 rgba(0,0,0,0.8),
						 1px 0 0 rgba(0,0,0,0.8),
						 0 -1px 0 rgba(0,0,0,0.8),
						 0 1px 0 rgba(0,0,0,0.8);
		}

		.multiple_shadow_3D {
			color: #fff;
			font-weight:bold;
			text-shadow: 0 1px 0 #eee,
						 0 2px 0 #e5e5e5,
						 -1px 3px 0 #C8C8C8,
						 -1px 4px 0 #C1C1C1,
						 -2px 5px 0 #B9B9B9,
						 -2px 6px 0 #B2B2B2,
						 -2px 7px 2px rgba(0,0,0, 0.6),
						 -2px 7px 8px rgba(0,0,0, 0.2),
						 -2px 7px 45px rgba(0,0,0, 0.4);
		}

		.embossed {
			color: #dce2e7;
			text-shadow: 1px 2px 0 rgba(0,0,0,0.4),
						 -1px -2px 0 rgba(255,255,255,1);
		}

		.embossed2 {
			color: #d1d9df;
			text-shadow: -1px -2px 0 rgba(0,0,0,0.4),
						 1px 2px 0 rgba(255,255,255,1);
		}
	</style>
	
	
</head>
<body style="background-image:-moz-linear-gradient(top,#aaeeff,#3399cc);
background-image:-webkit-gradient(linear,left top,left bottom,from(#aaeeff),to(#3399cc));
filter:progid:DXImageTransform.Microsoft.gradient(gradientType=0,startColorstr=#FFaaeeff, endColorstr=#FF3399cc);">
	<h1>CSS3 Shadows</h1>
	<div id="wrap">
	<h2>Démonstration de text-shadow</h2>
		<div id="ex1" class="bloc_text">Texte sans ombre</div>
		<div id="ex1" class="bloc_text single_shadow">Ombre simple</div>
		<div id="ex2" class="bloc_text more_readable"><span>Ombre</span> facilitant la lecture</div>
		<div id="ex3" class="bloc_text border_text">Effet de bordure de texte</div>
		<div id="ex4" class="bloc_text multiple_shadow">Anaglyphe textuel</div>
		<div id="ex5" class="bloc_text multiple_shadow_3D">Effet de perspective</div>
		<div id="ex6" class="bloc_text embossed">Effet bosselé</div>
		<div id="ex7" class="bloc_text embossed2">Effet creusé</div>
	</div>
	
</body>
</html>
