name: SaaS Aviation CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SaaS_Aviation/package-lock.json
      - name: Install
        working-directory: SaaS_Aviation
        run: npm ci
      - name: Lint
        working-directory: SaaS_Aviation
        run: npm run lint
      - name: Typecheck
        working-directory: SaaS_Aviation
        run: npm run typecheck
      - name: Test
        working-directory: SaaS_Aviation
        run: npm run test
      - name: Build
        working-directory: SaaS_Aviation
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saas_aviation_test
          POSTGRES_USER: saas_aviation_test
          POSTGRES_PASSWORD: saas_aviation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas_aviation_test -d saas_aviation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://saas_aviation_test:saas_aviation_test@127.0.0.1:5432/saas_aviation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SaaS_Aviation/package-lock.json
      - name: Install
        working-directory: SaaS_Aviation
        run: npm ci
      - name: PostgreSQL integration tests
        working-directory: SaaS_Aviation
        run: npm run test:postgres
